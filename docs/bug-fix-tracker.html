<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Lobotocraft · Bug / Todo 总台账</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101924;
      --surface: #172433;
      --surface-raised: #1e3041;
      --border: #344557;
      --ink: #ecf3f7;
      --muted: #a8bbc9;
      --accent: #7ddfcb;
      --accent-soft: #214b50;
      --warning: #ffd68c;
      --danger: #ffaca7;
      --success: #a4e3ac;
      --shadow: 0 18px 48px rgba(0, 0, 0, .2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 6% 0%, #204050 0%, transparent 30%), var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.55;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .shell { max-width: 1480px; padding: 28px clamp(14px, 3vw, 42px) 48px; margin: 0 auto; }
    .eyebrow { color: var(--accent); letter-spacing: .15em; font-size: 12px; font-weight: 700; }
    header h1 { font-size: clamp(28px, 3vw, 42px); letter-spacing: -.04em; margin: 4px 0; }
    .sub { color: var(--muted); max-width: 75ch; margin: 4px 0 20px; }
    .toolbar, .filters, .footer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .toolbar { margin-bottom: 20px; }
    .button {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-raised);
      color: var(--ink);
      padding: 9px 13px;
      min-height: 42px;
      white-space: nowrap;
    }
    .button:hover { border-color: var(--accent); }
    .button.primary { background: var(--accent); color: #10232b; border-color: transparent; font-weight: 700; }
    .button.subtle { background: transparent; }
    .button.danger { color: var(--danger); }
    .button:disabled { cursor: not-allowed; opacity: .55; }
    .ledger-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    .ledger-tabs .button[aria-selected="true"] { background: var(--accent); color: #10232b; border-color: var(--accent); font-weight: 700; }
    .view-note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .metric {
      background: rgba(30, 48, 65, .85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 0;
    }
    .metric .name { color: var(--muted); font-size: 13px; }
    .metric .value { font-size: clamp(24px, 3vw, 34px); line-height: 1.2; font-variant-numeric: tabular-nums; font-weight: 700; }
    .metric .hint { color: var(--muted); font-size: 11px; }
    .filters { margin: 16px 0 14px; }
    .filters label { font-size: 12px; color: var(--muted); display: grid; gap: 5px; min-width: 140px; }
    .filters .search { flex: 2 1 270px; }
    .filters .short { flex: 1 1 155px; }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
    }
    textarea { resize: vertical; min-height: 92px; }
    input::placeholder, textarea::placeholder { color: #8197a7; }
    .layout { display: grid; grid-template-columns: minmax(300px, 42%) minmax(0, 1fr); gap: 14px; align-items: start; }
    .list, .detail { background: rgba(23, 36, 51, .94); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
    .list { min-height: 420px; }
    .list-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 12px;
      color: var(--muted); font-size: 13px;
    }
    #issue-list { max-height: min(70vh, 830px); overflow-y: auto; }
    .group-title {
      position: sticky; top: 0; z-index: 1;
      background: #253849;
      color: #d6e9ed;
      padding: 8px 16px;
      font-size: 12px; font-weight: 700; letter-spacing: .03em;
    }
    .issue {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-top: 1px solid rgba(176, 198, 211, .1);
      padding: 12px 16px;
    }
    .issue:hover, .issue.active { background: #213849; }
    .issue.active { box-shadow: inset 3px 0 var(--accent); }
    .issue-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .code { color: var(--accent); font-size: 12px; font-weight: 700; }
    .excerpt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 5px 0 8px; font-size: 13px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge.unknown { color: var(--muted); background: #2a3949; }
    .badge.working { color: var(--warning); background: #4a3a27; }
    .badge.done { color: var(--accent); background: var(--accent-soft); }
    .badge.passed { color: var(--success); background: #294b39; }
    .badge.failed { color: var(--danger); background: #4f3036; }
    .detail { padding: clamp(16px, 2vw, 26px); min-height: 420px; }
    .detail h2 { margin: 0 0 6px; font-size: clamp(19px, 2.1vw, 25px); }
    .detail .meta { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
    .detail label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    .detail label > input, .detail label > select, .detail label > textarea { color: var(--ink); font-size: 14px; }
    .detail section { margin: 16px 0; }
    .detail section h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .detail .stack { display: grid; gap: 12px; }
    .detail textarea.long { min-height: 150px; }
    .detail textarea.medium { min-height: 105px; }
    .footer-actions { margin-top: 18px; justify-content: space-between; }
    #save-state { color: var(--muted); font-size: 12px; }
    #notice { min-height: 20px; color: var(--warning); font-size: 13px; }
    .empty { padding: 30px 18px; color: var(--muted); }
    dialog {
      width: min(570px, calc(100vw - 28px));
      max-height: 85vh; overflow: auto;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
    }
    dialog::backdrop { background: rgba(5, 13, 21, .72); }
    dialog form { display: grid; gap: 13px; }
    dialog h2 { margin: 0; }
    .file-input { display: none; }
    @media (max-width: 900px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .layout { grid-template-columns: 1fr; }
      #issue-list { max-height: 400px; }
    }
    @media (max-width: 540px) {
      .shell { padding-top: 18px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: 1fr; }
      .toolbar .button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">LOBOTOCRAFT / ISSUE LEDGER</div>
      <h1>Bug / Todo 总台账</h1>
      <p class="sub">Bug、待办和已完成Bug归档分开管理。归档保留全文及证据，自动测试通过不等于实机验收。Todo默认仅登记，获授权后按各条实施状态记录进度。更改保存在此浏览器，跨电脑请导出备份。</p>
    </header>

    <div class="toolbar">
      <button id="add" class="button primary" type="button">＋ 新增问题</button>
      <button id="import-md" class="button" type="button">导入反馈 MD</button>
      <button id="import-json" class="button" type="button">导入台账 JSON</button>
      <button id="export-json" class="button" type="button">备份 JSON</button>
      <button id="export-md" class="button" type="button">导出交接 MD</button>
      <input id="md-file" class="file-input" type="file" accept=".md,text/markdown,text/plain">
      <input id="json-file" class="file-input" type="file" accept=".json,application/json">
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <nav class="ledger-tabs" aria-label="台账分区">
      <button id="view-bug" class="button" type="button" aria-selected="true">Bug</button>
      <button id="view-todo" class="button" type="button" aria-selected="false">Todo</button>
      <button id="view-archive" class="button" type="button" aria-selected="false">Bug归档</button>
    </nav>
    <p id="view-note" class="view-note"></p>

    <section class="metrics" aria-label="修复统计">
      <div class="metric"><div class="name">当前分区条目</div><div class="value" id="count-all">—</div><div class="hint">统计不含其他分区</div></div>
      <div class="metric"><div class="name">代码已改</div><div class="value" id="count-implemented">—</div><div class="hint">不等于已验收</div></div>
      <div class="metric"><div class="name">自动测试通过</div><div class="value" id="count-automated">—</div><div class="hint">仍可待实机验证</div></div>
      <div class="metric"><div class="name">实机验收</div><div class="value" id="count-accepted">—</div><div class="hint">需要人工确认</div></div>
      <div class="metric"><div class="name">实施未核实</div><div class="value" id="count-unknown">—</div><div class="hint">不推断为未修</div></div>
    </section>

    <div class="filters">
      <label class="search">搜索编号、现象、备注<input id="search" type="search" placeholder="例如：数据删除 / 恐慌救助 / PALE"></label>
      <label class="short">实施状态<select id="filter-implementation"></select></label>
      <label class="short">验证状态<select id="filter-verification"></select></label>
      <label class="short">分类<select id="filter-bucket"></select></label>
      <label class="short">对象<select id="filter-section"></select></label>
    </div>

    <div class="layout">
      <section class="list" aria-label="问题列表">
        <div class="list-head"><span id="shown">问题列表</span><span id="source">内置快照</span></div>
        <div id="issue-list"></div>
      </section>
      <section id="detail" class="detail" aria-label="问题详情" aria-live="polite"></section>
    </div>
  </main>

  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form">
      <h2 id="add-title">新增问题</h2>
      <label>台账类型<select name="category" required><option value="bug">Bug</option><option value="enhancement">Todo</option></select></label>
      <label>类别<select name="bucket" required><option>稳定复现</option><option>非常难复现</option><option>代码审查</option><option>加时赛</option></select></label>
      <label>对象／小节<input name="section" required placeholder="例如：O-03-89 数据删除"></label>
      <label>当前／不应／而是<textarea name="report" required placeholder="当前……；不应……；而是应……"></textarea></label>
      <div class="footer-actions"><button id="cancel-add" class="button subtle" type="button">取消</button><button class="button primary" type="submit">新增到台账</button></div>
    </form>
  </dialog>

          && (!$("filter-section").value || issue.section === $("filter-section").value)
          && (!query || [issue.section, issue.report, issue.after, p.note, p.evidence, p.owner, issue.number]
            .some(value => plain(value).toLocaleLowerCase().includes(query)));
      });
    }
    function selectIssue(id) {
      if (dirty && !confirm("当前详情有未保存修改，确定放弃吗？")) return;
      selectedId = id;
      dirty = false;
      renderList();
      renderDetail();
    }
    function renderList() {
      const container = $("issue-list");
      container.replaceChildren();
      const filtered = filteredIssues();
      $("shown").textContent = `显示 ${filtered.length} / ${issues.filter(issue => inView(issue)).length} 条`;
      $("source").textContent = sourceLabel;
      let lastSection = "";
      for (const issue of filtered) {
        const group = `${issue.bucket} / ${issue.section}`;
        if (group !== lastSection) {
          const title = document.createElement("div");
          title.className = "group-title";
          title.textContent = group;
          container.append(title);
          lastSection = group;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "issue" + (issue.id === selectedId ? " active" : "");
        button.setAttribute("aria-current", issue.id === selectedId ? "true" : "false");
        const top = document.createElement("div");
        top.className = "issue-top";
        const code = document.createElement("span");
        code.className = "code";
        code.textContent = `${issue.section} · ${issue.number}`;
        top.append(code);
        const excerpt = document.createElement("div");
        excerpt.className = "excerpt";
        excerpt.textContent = plain(issue.report);
        const badges = document.createElement("div");
        badges.className = "badges";
        const p = getProgress(issue);
        badges.append(badge(p.implementation, implementationBadge(p.implementation)),
          badge(p.verification, verificationBadge(p.verification)));
        button.append(top, excerpt, badges);
        button.addEventListener("click", () => selectIssue(issue.id));
        container.append(button);
      }
      if (!filtered.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "没有匹配的问题。试试清空搜索或切换筛选。";
        container.append(empty);
      }
    }
    function field(labelText, type, key, value, extraClass = "") {
      const label = document.createElement("label");
      label.textContent = labelText;
      const control = type === "textarea" ? document.createElement("textarea") : document.createElement(type);
      control.id = "edit-" + key;
      control.value = value || "";
      if (type === "textarea") control.className = extraClass;
      control.addEventListener("input", () => { dirty = true; $("save-state").textContent = "有未保存修改"; });
      label.append(control);
      return label;
    }
    function dropdown(labelText, key, value, list) {
      const label = document.createElement("label");
      label.textContent = labelText;
      const control = document.createElement("select");
      control.id = "edit-" + key;
      for (const item of list) control.add(new Option(item, item));
      control.value = list.includes(value) ? value : list[0];
      control.addEventListener("change", () => { dirty = true; $("save-state").textContent = "有未保存修改"; });
      label.append(control);
      return label;
    }
    function renderDetail() {
      const root = $("detail");
      root.replaceChildren();
      const issue = issues.find(item => item.id === selectedId);
      if (!issue) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "从左侧选一条反馈，查看全文并记录修复与验证。";
        root.append(empty);
        return;
      }
      const p = getProgress(issue);
      const title = document.createElement("h2");
      title.textContent = `${issue.section} · 第 ${issue.number} 条`;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${isTodo(issue) ? "Todo" : isArchived(issue) ? "Bug归档" : "Bug"} · ${issue.bucket} · ${p.updatedAt ? "上次保存 " + new Date(p.updatedAt).toLocaleString("zh-CN") :
        supplementalProgress[issue.id] || feedbackFixes[issue.id]
          ? "内置核查记录（日期见复测记录）" : "尚未记录更新时间"}`;
      const textFields = document.createElement("section");
      textFields.className = "stack";
      textFields.append(
        field(isTodo(issue) ? "Todo需求（可编辑）" : "问题与预期（可编辑）", "textarea", "report", issue.report, "long"),
        field("原反馈中的修复后记录（可编辑）", "textarea", "after", issue.after, "medium")
      );
      const stateTitle = document.createElement("h3");
      stateTitle.textContent = "实施与验证";
      const state = document.createElement("section");
      state.className = "detail-grid";
      state.append(dropdown("是否动过代码", "implementation", p.implementation, implementationOptions),
        dropdown("验证到了哪一步", "verification", p.verification, verificationOptions));
      const classification = document.createElement("section");
      classification.className = "detail-grid";
      classification.append(dropdown("台账类型", "category", isTodo(issue) ? "Todo" : "Bug", ["Bug", "Todo"]));
      if (!isTodo(issue)) {
        const mode = archiveMode(issue);
        classification.append(dropdown("归档方式", "archive",
          mode === "archived" ? "手动归档" : mode === "active" ? "保留在Bug" : "按完成状态自动",
          ["按完成状态自动", "手动归档", "保留在Bug"]));
      }
      const other = document.createElement("section");
      other.className = "stack";
      other.append(field("负责人（可选）", "input", "owner", p.owner),
        field("修复记录 / 复现结果", "textarea", "note", p.note, "medium"),
        field("证据（日志路径、测试名、提交号或截图说明）", "textarea", "evidence", p.evidence, "medium"));
      const footer = document.createElement("div");
      footer.className = "footer-actions";
      const save = document.createElement("button");
      save.type = "button";
      save.className = "button primary";
      save.textContent = "保存此条";
      save.addEventListener("click", saveSelected);
      const stateLabel = document.createElement("span");
      stateLabel.id = "save-state";
      stateLabel.textContent = "修改后点击保存";
      footer.append(save, stateLabel);
      root.append(title, meta, textFields, classification, stateTitle, state, other, footer);
    }
    function saveSelected() {
      const issue = issues.find(item => item.id === selectedId);
      if (!issue) return;
      const report = $("edit-report").value.trim();
      if (!report) return setNotice("问题与预期不能为空。", true);
      issue.report = report;
      issue.after = $("edit-after").value.trim();
      const archiveSelection = $("edit-archive")?.value;
      issue.category = $("edit-category").value === "Todo" ? "enhancement" : "bug";
      progress[issue.id] = {
        ...getProgress(issue),
        implementation: $("edit-implementation").value,
        verification: $("edit-verification").value,
        owner: $("edit-owner").value.trim(),
        note: $("edit-note").value.trim(),
        evidence: $("edit-evidence").value.trim(),
        updatedAt: new Date().toISOString(),
        archiveMode: archiveSelection === "手动归档" ? "archived"
          : archiveSelection === "保留在Bug" ? "active" : archiveSelection ? "auto" : archiveMode(issue)
      };
      dirty = false;
      const moved = !inView(issue);
      if (moved) {
        selectedId = issues.find(item => inView(item))?.id || null;
      }
      persist();
      renderAll();
      setNotice(moved ? "已保存，条目已移至对应分区；记录未删除。" : "已保存这条问题。");
    }
    function makeId(bucket, section, number) { return `${bucket} / ${section} #${number}`; }
    function parseMarkdown(text) {
      const result = [];
      let bucket = "稳定复现", section = "", category = "bug";
      for (const line of text.split(/\r?\n/)) {
        const main = line.match(/^##\s+(.+)$/);
        if (main) { if (/Todo/i.test(main[1])) { category = "enhancement"; bucket = main[1].replace(/^Todo\s*\/\s*/i, "").trim() || "Todo"; }
          else if (/^(Bug|Bug归档)\s*\//.test(main[1])) { category = "bug"; bucket = main[1].replace(/^(Bug|Bug归档)\s*\/\s*/, ""); }
          else if (/非常难复现/.test(main[1])) { category = "bug"; bucket = "非常难复现"; }
          else if (/代码审查/.test(main[1])) bucket = "代码审查";
          else if (/稳定复现/.test(main[1])) bucket = "稳定复现"; continue; }
        const sub = line.match(/^###\s+(.+)$/);
        if (sub) { section = sub[1].trim(); continue; }
        const row = line.match(/^\|\s*(\d+)\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|$/);
        if (row && section) {
          const number = Number(row[1]);
          result.push({ id: makeId(bucket, section, number), bucket, section, number, report: row[2], after: row[3], category });
          continue;
        }
        // Also accept the previous numbered-list version of the feedback document.
        const bullet = line.match(/^(\d+)\.\s+(.+)$/);
        if (bullet && section) {
          const number = Number(bullet[1]);
          result.push({ id: makeId(bucket, section, number), bucket, section, number, report: bullet[2], after: "", category });
        }
      }
      if (!result.length || new Set(result.map(item => item.id)).size !== result.length) {
        throw new Error("未找到有效问题，或存在相同分类／对象／编号的重复条目。");
      }
      return result;
    }
    function download(name, contents, type) {
      const url = URL.createObjectURL(new Blob([contents], { type }));
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function markdownCell(text) { return String(text || "").replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>"); }
    function exportMarkdown() {
      if (dirty && !confirm("当前详情尚未保存。导出的交接文档不会包含这些输入，仍要导出吗？")) return;
      const lines = ["# Lobotocraft Bug / Todo 总台账交接", "", `导出时间：${new Date().toLocaleString("zh-CN")}`, "", "说明：由独立台账导出，不覆盖原反馈文档。归档不等于实机验收，Todo仅登记。完整ID、手工归档方式及状态恢复请使用JSON备份。", ""];
      const exported = ["bug", "todo", "archive"].flatMap(view => issues.filter(issue => inView(issue, view)));
      let lastBucket = "", lastSection = "";
      for (const issue of exported) {
        const lane = isTodo(issue) ? "Todo" : isArchived(issue) ? "Bug归档" : "Bug";
        const bucket = `${lane} / ${issue.bucket}`;
        if (bucket !== lastBucket) { lines.push(`## ${bucket}`, ""); lastBucket = bucket; lastSection = ""; }
        if (issue.section !== lastSection) {
          lines.push(`### ${issue.section}`, "", "| 编号 | 当前／不应／而是 | 修复后（复测记录） |", "|---:|---|---|");
          lastSection = issue.section;
        }
        const p = getProgress(issue);
        const record = [issue.after, `实施：${p.implementation}；验证：${p.verification}`,
          p.owner ? `负责人：${p.owner}` : "", p.note ? `记录：${p.note}` : "",
          p.evidence ? `证据：${p.evidence}` : ""].filter(Boolean).join("；");
        lines.push(`| ${issue.number} | ${markdownCell(issue.report)} | ${markdownCell(record)} |`);
        const next = exported[exported.indexOf(issue) + 1];
        if (!next || next.section !== issue.section || next.bucket !== issue.bucket) lines.push("");
      }
      download("lobotocraft-bug-handoff.md", lines.join("\n"), "text/markdown;charset=utf-8");
    }
    function renderAll() {
      for (const view of ["bug", "todo", "archive"]) {
        const count = issues.filter(issue => inView(issue, view)).length;
        $(`view-${view}`).textContent = `${view === "bug" ? "Bug" : view === "todo" ? "Todo" : "Bug归档"} · ${count}`;
        $(`view-${view}`).setAttribute("aria-selected", String(view === ledgerView));
      }
      $("view-note").textContent = ledgerView === "todo"
        ? "Todo默认仅登记；获单独授权实施后记录进度。实施与验证状态分开，未标实机通过不能视为客户端验收。"
        : ledgerView === "archive"
          ? "归档不删除记录。已改且自动/实机测试通过，或无需改的已结案Bug自动归档；自动通过仍可待实机验收。可在详情选择“保留在Bug”移回。"
          : "这里展示未归档Bug。未验证或测试失败不会自动归档；可在详情指定归档方式。";
      renderFilterOptions();
      renderMetrics();
      renderList();
      renderDetail();
    }
    async function loadFile(input, kind) {
      const file = input.files?.[0];
      input.value = "";
      if (!file) return;
      if (dirty && !confirm("当前详情尚未保存，继续导入会丢弃这些输入，确定吗？")) return;
      try {
        const raw = await file.text();
        if (kind === "md") {
          const parsed = parseMarkdown(raw);
          if (!confirm(`从 ${file.name} 找到 ${parsed.length} 条问题。导入会更新问题文本，现有同编号的状态将保留；缺失的内置代码审查条目会补充。继续吗？`)) return;
          const next = {};
          issues = mergeSupplemental(parsed);
          for (const issue of issues) next[issue.id] = mergeProgress(issue, progress[issue.id]);
          progress = next;
          sourceLabel = file.name;
          imported = true;
        } else {
          const saved = JSON.parse(raw);
          if (saved.schema !== 1 || !Array.isArray(saved.issues) || !saved.progress ||
              saved.issues.some(item => !item.id || !item.section || typeof item.report !== "string")) {
            throw new Error("JSON 格式不符合本工具的台账备份格式。");
          }
          if (!confirm(`将用 ${file.name} 中的 ${saved.issues.length} 条问题及状态替换当前台账。继续吗？`)) return;
          issues = mergeSupplemental(copy(saved.issues));
          progress = {};
          for (const issue of issues) progress[issue.id] = mergeProgress(issue, saved.progress[issue.id]);
          sourceLabel = saved.sourceLabel || file.name;
          imported = Boolean(saved.imported);
          if (["bug", "todo", "archive"].includes(saved.ledgerView)) ledgerView = saved.ledgerView;
        }
        selectedId = issues.find(issue => inView(issue))?.id || null;
        dirty = false;
        persist();
        renderAll();
        setNotice(`已导入 ${issues.length} 条问题。`);
      } catch (error) {
        setNotice(`导入失败：${error.message}`, true);
      }
    }
    restore();
    selectedId = issues.find(issue => inView(issue))?.id || null;
    renderAll();
    for (const view of ["bug", "todo", "archive"])
      $(`view-${view}`).addEventListener("click", () => switchView(view));
    for (const name of ["search", "filter-implementation", "filter-verification", "filter-bucket", "filter-section"]) {
      $(name).addEventListener(name === "search" ? "input" : "change", renderList);
    }
    $("import-md").addEventListener("click", () => $("md-file").click());
    $("import-json").addEventListener("click", () => $("json-file").click());
    $("md-file").addEventListener("change", () => loadFile($("md-file"), "md"));
    $("json-file").addEventListener("change", () => loadFile($("json-file"), "json"));
    $("export-json").addEventListener("click", () => {
      if (dirty && !confirm("当前详情尚未保存。JSON 备份不会包含这些输入，仍要导出吗？")) return;
      download("lobotocraft-bug-ledger.json", JSON.stringify({ schema: 1, issues, progress, sourceLabel, imported: true, ledgerView }, null, 2), "application/json;charset=utf-8");
    });
    $("export-md").addEventListener("click", exportMarkdown);
    $("add").addEventListener("click", () => {
      if (dirty && !confirm("当前详情尚未保存，新增问题前请先保存。确定放弃这些输入吗？")) return;
      dirty = false;
      $("add-form").elements.namedItem("category").value = ledgerView === "todo" ? "enhancement" : "bug";
      $("add-dialog").showModal();
    });
    $("cancel-add").addEventListener("click", () => $("add-dialog").close());
    $("add-form").addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const bucket = String(data.get("bucket")).trim();
      const section = String(data.get("section")).trim();
      const report = String(data.get("report")).trim();
      const category = data.get("category") === "enhancement" ? "enhancement" : "bug";
      if (!bucket || !section || !report) return;
      const numbers = issues.filter(issue => issue.bucket === bucket && issue.section === section).map(issue => issue.number);
      const number = Math.max(0, ...numbers) + 1;
      const issue = { id: makeId(bucket, section, number), bucket, section, number, report, after: "",
        category, triageState: "needs-triage" };
      issues.push(issue);
      progress[issue.id] = initialProgress(issue);
      selectedId = issue.id;
      ledgerView = category === "enhancement" ? "todo" : "bug";
      dirty = false;
      event.currentTarget.reset();
      $("add-dialog").close();
      persist();
      renderAll();
      setNotice("新问题已加入台账。");
    });
  })();
  </script>
</body>
</html>
