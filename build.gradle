buildscript {
    repositories {
        maven {
            name = "MinecraftForge"
            url = "https://maven.minecraftforge.net"
        }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file(System.getenv('LOBOTOCRAFT_GAMETEST_DIR') ?: 'run-gametest')
            property 'forge.enabledGameTestNamespaces',
                    System.getenv('LOBOTOCRAFT_GAMETEST_NAMESPACES')
                            ?: "${mod_id},${mod_id}_navigation,${mod_id}_recent_fixes,${mod_id}_lumberjack,${mod_id}_must_open_path,${mod_id}_review_flows,${mod_id}_meltdown,${mod_id}_queen_of_hatred,${mod_id}_blue_star_lifecycle,${mod_id}_mob_ai_lock"
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
    config "lobotocraft_facility.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("curse.maven:geckolib-388172:7025129")
    implementation fg.deobf("curse.maven:jade-324717:6271651")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    runtimeOnly fg.deobf("maven.modrinth:infinity-item-editor-re:1.20.1-1.2.0-B")
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Forge's GameTest runner loads test structures from the working directory,
// rather than the normal mod resource manager. Keep the dev fixture in sync.
tasks.configureEach {
    if (name == 'prepareRunGameTestServer') {
        doLast {
            copy {
                from file('src/main/resources/gameteststructures')
                into file((System.getenv('LOBOTOCRAFT_GAMETEST_DIR') ?: 'run-gametest')
                        + '/gameteststructures')
            }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)

    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def gameTestDirectory = file(System.getenv('LOBOTOCRAFT_GAMETEST_DIR') ?: 'run-gametest')
        delete new File(gameTestDirectory, 'world')
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('reobfJar')
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (!artifact.isFile()) throw new GradleException("Release jar was not created: ${artifact}")
        def requiredEntries = [
                'com/wzz/lobotocraft/event/listener/SpecialKillSpawnEvent.class',
                'com/wzz/lobotocraft/world/data/LobotomySpawnSavedData.class',
                'com/wzz/lobotocraft/employee/EmployeeRuntimeManager.class',
                'com/wzz/lobotocraft/employee/EmployeeRuntimeManager$RangedProfile.class',
                'com/wzz/lobotocraft/employee/EmployeeAppearance.class',
                'com/wzz/lobotocraft/compat/ysm/YsmEmployeeCompat.class',
                'com/wzz/lobotocraft/compat/ysm/YsmClassLocator.class',
                'com/wzz/lobotocraft/client/compat/YsmClientCompat.class',
                'com/wzz/lobotocraft/client/screen/YsmEmployeeModelScreen.class',
                'com/wzz/lobotocraft/event/listener/BlackForestEvent$BirdRole.class',
                'com/wzz/lobotocraft/item/ego/base/AiSpecialEgoWeapon.class',
                'com/wzz/lobotocraft/llm/EmployeeRadioService.class',
                'lobotocraft.mixins.json',
                'META-INF/mods.toml'
        ]
        def zip = new java.util.zip.ZipFile(artifact)
        try {
            requiredEntries.each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Release jar is missing required entry ${entry}: ${artifact.name}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('installReleaseToPack') {
    dependsOn tasks.named('verifyReleaseJar')
    doLast {
        def configured = providers.gradleProperty('packModsDir').orNull
        if (configured == null || configured.isBlank()) {
            throw new GradleException('Set -PpackModsDir=<absolute mods directory> to install a verified release jar.')
        }
        def destination = file(configured)
        if (!destination.isDirectory()) throw new GradleException("Pack mods directory does not exist: ${destination}")
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def target = new File(destination, artifact.name)
        def temporary = new File(destination, ".${artifact.name}.installing")
        java.nio.file.Files.copy(artifact.toPath(), temporary.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        try {
            java.nio.file.Files.move(temporary.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                    java.nio.file.StandardCopyOption.ATOMIC_MOVE)
        } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
            java.nio.file.Files.move(temporary.toPath(), target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        destination.listFiles()?.findAll { candidate ->
            candidate.name.startsWith("${mod_id}-") && candidate.name.endsWith('.jar') && candidate != target
        }?.each { stale ->
            if (!stale.delete()) throw new GradleException("Could not remove stale mod jar: ${stale}")
        }
    }
}
